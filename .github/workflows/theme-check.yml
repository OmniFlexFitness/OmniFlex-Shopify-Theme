name: Theme Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Theme Check (advisory — pre-existing Dawn fork debt)
        # MatchingTranslations disabled via .theme-check.yml. Remaining errors
        # (ValidSchemaName, ParserBlockingScript, etc.) are pre-existing on main.
        # Report them without failing the job until a dedicated cleanup PR lands.
        # Baseline and plan: docs/theme-check-baseline.md
        # JSON syntax validation below remains a hard gate.
        uses: shopify/theme-check-action@v2
        continue-on-error: true
        with:
          theme_root: .
          flags: --fail-level error

      - name: Validate JSON templates (hard gate)
        # Shopify JSON templates/settings often start with a /* auto-generated */ header.
        run: python3 scripts/validate-json.py

  preview-theme:
    name: Development theme preview (optional)
    runs-on: ubuntu-latest
    needs: theme-check
    if: >
      github.event_name == 'pull_request' &&
      vars.SHOPIFY_STORE != ''
    # One preview push per PR at a time, so two quick commits cannot both
    # decide the theme is missing and create duplicates.
    concurrency:
      group: preview-theme-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      # Must match the name in .github/workflows/theme-preview-cleanup.yml.
      PREVIEW_THEME_NAME: 'PR #${{ github.event.pull_request.number }} preview'
    steps:
      - uses: actions/checkout@v4
      # shopify/cli-action does not exist on GitHub, so the CLI is installed
      # from npm. Shopify CLI 5.x needs Node >= 22.12. Pinned to the major so
      # a future CLI 6 cannot silently change push/delete flags.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@5
      - name: Push preview theme
        # No continue-on-error: a full theme library (20-theme cap) or a bad
        # token must show as a failed check, not a silent pass.
        #
        # `--unpublished` always creates a NEW theme, so pushing it on every
        # commit would add one theme per commit. Instead, look up this PR's
        # preview by exact name (unpublished role only, never live) and push
        # into it; create it only on the first run.
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          set -euo pipefail
          only=(--only 'assets/*' 'layout/*' 'sections/*' 'snippets/*' 'templates/*' 'config/*' 'locales/*')

          existing_id="$(
            shopify theme list --role unpublished --json \
              | jq -r --arg name "$PREVIEW_THEME_NAME" \
                  '[.. | objects | select(has("id") and has("name") and has("role"))
                     | select(.name == $name and .role == "unpublished") | .id] | first // empty'
          )"

          if [ -n "$existing_id" ]; then
            echo "Updating existing preview theme $existing_id ($PREVIEW_THEME_NAME)"
            shopify theme push --theme "$existing_id" "${only[@]}" --json
          else
            echo "Creating preview theme: $PREVIEW_THEME_NAME"
            shopify theme push --unpublished --theme "$PREVIEW_THEME_NAME" "${only[@]}" --json
          fi

  # Lighthouse CI starts ADVISORY. Raise lhci_min_score_performance and remove
  # continue-on-error once the 3D/shader JS (iwb-shaders.js,
  # scroll-3d-showcase.js, neon-cursor-hero.js) is code-split behind section
  # presence and sparkle.gif is replaced. See docs/theme-audit-2026-10.md.
  lighthouse:
    name: Lighthouse CI (advisory)
    runs-on: ubuntu-latest
    needs: theme-check
    if: >
      github.event_name == 'pull_request' &&
      vars.SHOPIFY_STORE != ''
    permissions:
      contents: read
      # Lets LHCI post its scores as commit status checks via GITHUB_TOKEN.
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Lighthouse credentials
        # The action needs a Dev Dashboard app (client ID + secret, scopes
        # read_products and write_themes). A Theme Access password does not
        # work here. Skip cleanly with a notice until the secrets exist.
        id: creds
        env:
          HAS_ID: ${{ secrets.SHOPIFY_LHCI_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.SHOPIFY_LHCI_CLIENT_SECRET != '' }}
        run: |
          if [ "$HAS_ID" = "true" ] && [ "$HAS_SECRET" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Lighthouse skipped::Set SHOPIFY_LHCI_CLIENT_ID and SHOPIFY_LHCI_CLIENT_SECRET to enable Lighthouse CI."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lighthouse
        if: steps.creds.outputs.ready == 'true'
        uses: shopify/lighthouse-ci-action@v1
        continue-on-error: true
        with:
          store: ${{ vars.SHOPIFY_STORE }}
          client_id: ${{ secrets.SHOPIFY_LHCI_CLIENT_ID }}
          client_secret: ${{ secrets.SHOPIFY_LHCI_CLIENT_SECRET }}
          product_handle: ${{ vars.LIGHTHOUSE_PRODUCT_HANDLE }}
          collection_handle: ${{ vars.LIGHTHOUSE_COLLECTION_HANDLE }}
          lhci_github_token: ${{ secrets.GITHUB_TOKEN }}
          lhci_min_score_performance: 0.6
          lhci_min_score_accessibility: 0.9
