name: Theme Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Theme Check (advisory — pre-existing Dawn fork debt)
        # MatchingTranslations disabled via .theme-check.yml. Remaining errors
        # (ValidSchemaName, ParserBlockingScript, etc.) are pre-existing on main.
        # Report them without failing the job until a dedicated cleanup PR lands.
        # JSON syntax validation below remains a hard gate.
        uses: shopify/theme-check-action@v2
        continue-on-error: true
        with:
          theme_root: .
          flags: --fail-level error

      - name: Validate JSON templates (hard gate)
        # Locales use leading /* */ comments (JSONC) — skipped here; Theme Check covers them.
        # Only templates + config/settings_schema.json must be strict JSON.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$f"; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            fi
          done < <(find templates -type f -name '*.json' -print0)
          if [ -f config/settings_schema.json ]; then
            if ! python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' config/settings_schema.json; then
              echo "::error file=config/settings_schema.json::Invalid JSON"
              fail=1
            fi
          fi
          # settings_data.json is merchant state and may be huge; syntax-check only if present
          if [ -f config/settings_data.json ]; then
            if ! python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' config/settings_data.json; then
              echo "::error file=config/settings_data.json::Invalid JSON"
              fail=1
            fi
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Template/config JSON parsed cleanly."

  preview-theme:
    name: Development theme preview (optional)
    runs-on: ubuntu-latest
    needs: theme-check
    if: >
      github.event_name == 'pull_request' &&
      vars.SHOPIFY_STORE != ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup Shopify CLI
        uses: shopify/cli-action@v1
        with:
          version: latest
      - name: Push development theme
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme push \
            --unpublished \
            --theme "PR #${{ github.event.pull_request.number }} cyber-pastel preview" \
            --only 'assets/*' 'layout/*' 'sections/*' 'snippets/*' 'templates/*' 'config/*' 'locales/*' \
            --json
        continue-on-error: true
