name: Theme Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Theme Check (advisory — pre-existing Dawn fork debt)
        # MatchingTranslations disabled via .theme-check.yml. Remaining errors
        # (ValidSchemaName, ParserBlockingScript, etc.) are pre-existing on main.
        # Report them without failing the job until a dedicated cleanup PR lands.
        # JSON syntax validation below remains a hard gate.
        uses: shopify/theme-check-action@v2
        continue-on-error: true
        with:
          theme_root: .
          flags: --fail-level error

      - name: Validate JSON templates (hard gate)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, re, sys
          fail = 0

          def check_strict(path: pathlib.Path) -> None:
              global fail
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"::error file={path}::{exc}")
                  fail = 1

          def check_locale(path: pathlib.Path) -> None:
              """Shopify locale JSON allows a leading /* ... */ translation comment."""
              global fail
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"/\*.*?\*/", "", text, count=1, flags=re.S)
              try:
                  json.loads(text)
              except Exception as exc:
                  print(f"::error file={path}::{exc}")
                  fail = 1

          for root in ("templates", "config"):
              for path in pathlib.Path(root).rglob("*.json"):
                  check_strict(path)
          for path in pathlib.Path("locales").rglob("*.json"):
              check_locale(path)

          if fail:
              sys.exit(1)
          print("All JSON templates/config/locales parsed cleanly.")
          PY

  preview-theme:
    name: Development theme preview (optional)
    runs-on: ubuntu-latest
    needs: theme-check
    if: >
      github.event_name == 'pull_request' &&
      vars.SHOPIFY_STORE != ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup Shopify CLI
        uses: shopify/cli-action@v1
        with:
          version: latest
      - name: Push development theme
        env:
          SHOPIFY_FLAG_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme push \
            --unpublished \
            --theme "PR #${{ github.event.pull_request.number }} cyber-pastel preview" \
            --only 'assets/*' 'layout/*' 'sections/*' 'snippets/*' 'templates/*' 'config/*' 'locales/*' \
            --json
        continue-on-error: true
